name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TACHIKOMA_DISABLE_API_TESTS: "true"
  TACHIKOMA_TEST_MODE: mock

jobs:
  test:
    name: Swift (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS 15
            os: macos-15
            swift: '6.2.4'
          - name: Ubuntu 24.04
            os: ubuntu-24.04
            swift: '6.2.4'
          - name: Ubuntu 24.04, Swift 6.3.3
            os: ubuntu-24.04
            swift: '6.3.3'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select Xcode 26.3
        if: runner.os == 'macOS'
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: '26.3'

      - name: Install Swift ${{ matrix.swift }}
        if: runner.os == 'Linux'
        uses: SwiftyLab/setup-swift@38f54a76b70d989321de9dc7c840618c08cf56e9 # v1.14.0
        with:
          swift-version: ${{ matrix.swift }}

      - name: Cache Swift Package Manager
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build
            ~/.cache/org.swift.swiftpm
          key: ${{ runner.os }}-${{ runner.arch }}-swift-${{ matrix.swift }}-spm-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-swift-${{ matrix.swift }}-spm-

      - name: Verify locked dependencies
        run: |
          swift package resolve
          git diff --exit-code -- Package.resolved

      - name: Build release products
        run: swift build -c release --verbose

      - name: Run hermetic tests (macOS)
        if: runner.os == 'macOS'
        run: swift test --parallel

      - name: Run hermetic tests (Linux)
        if: runner.os == 'Linux'
        run: |
          # Linux URLProtocol cannot host the mocked provider E2E/audio suites.
          swift test --no-parallel \
            --skip OpenAIAudioProviderTests \
            --skip ProviderEndToEndTests

      - name: Typecheck guide examples
        if: runner.os == 'macOS'
        run: python3 scripts/check-doc-examples.py

  package:
    name: Package contract
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select Xcode 26.3
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: '26.3'

      - name: Validate package metadata and dependency graph
        run: |
          package_dump="$(swift package dump-package)"
          jq -e '.swiftLanguageVersions[] | select(. == "6")' <<< "$package_dump" >/dev/null
          if jq -e 'any(.dependencies[]; .. | .identity? == "commander")' <<< "$package_dump" >/dev/null; then
            echo "::error::The root package must not depend on Commander."
            exit 1
          fi
          swift package describe --type json | jq -e '.name == "Tachikoma"' >/dev/null
          swift package show-dependencies --format json | jq -e '.name == "Tachikoma"' >/dev/null

  style:
    name: Swift style
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned linters
        run: |
          scripts/install-ci-tools.sh "$RUNNER_TEMP/tachikoma-tools"
          echo "$RUNNER_TEMP/tachikoma-tools" >> "$GITHUB_PATH"

      - name: SwiftLint
        run: swiftlint lint --config .swiftlint.yml --strict

      - name: SwiftFormat
        run: swiftformat --lint .
